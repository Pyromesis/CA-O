name: build-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CA-O.sln

      - name: Build
        run: dotnet build CA-O.sln -c Release --no-restore

      - name: Test
        run: dotnet test CA-O.sln -c Release --no-build

  security-analysis:
    permissions:
      security-events: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build
        run: dotnet build CA-O.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
