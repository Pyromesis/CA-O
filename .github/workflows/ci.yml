name: build-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CA-O.sln
      - name: NuGet audit (no vulnerable packages)
        run: dotnet list CA-O.sln package --vulnerable --include-transitive
      - name: Build (Release, warnings as errors)
        run: dotnet build CA-O.sln -c Release --no-restore
      - name: Test (Release gates)
        run: dotnet test CA-O.sln -c Release --no-build --logger "trx;LogFileName=test.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  security-analysis:
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
      - name: Build
        run: dotnet build CA-O.sln -c Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
